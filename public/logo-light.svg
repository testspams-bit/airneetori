<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%" fill="none">
  <!-- Mortarboard Cap -->
  <g id="mortarboard" transform="translate(250, 85)">
    <!-- Cap Diamond -->
    <polygon points="0,-55 105,-25 0,8 -105,-25" fill="#0A0D14"/>
    <!-- Skull Cap Underside -->
    <path d="M -60,-18 Q 0,22 60,-18 L 60,-4 Q 0,36 -60,-4 Z" fill="#0A0D14"/>
    <!-- Button & Tassel hanging to left -->
    <circle cx="0" cy="-25" r="4.5" fill="#0066FF"/>
    <path d="M 0,-25 Q -50,-15 -74,4 L -74,45" stroke="#0A0D14" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Tassel Fringe -->
    <polygon points="-79,45 -69,45 -70,68 -78,68" fill="#0A0D14"/>
  </g>

  <!-- Slanted "AIR" Wordmark (Faithful to AIR.png) -->
  <g id="air" transform="translate(250, 230)">
    <!-- Letter A -->
    <path d="M -195,45 L -145,45 L -174,-45 L -220,-45 L -258,45 L -215,45 L -207,26 L -175,26 Z M -191,-14 L -183,10 L -201,10 Z" fill="#0A0D14"/>
    
    <!-- Letter I -->
    <path d="M -112,45 L -68,45 L -38,-45 L -82,-45 Z" fill="#0A0D14"/>
    
    <!-- Letter R -->
    <path d="M -24,45 L 20,45 L 31,9 C 33,9 38,9 44,9 C 74,9 94,-1 99,-20 C 104,-39 88,-45 58,-45 L -2,-45 Z M 34,-26 L 49,-26 C 60,-26 65,-23 63,-17 C 61,-11 53,-9 43,-9 L 29,-9 Z" fill="#0A0D14"/>
    <circle cx="43" cy="-17" r="10" fill="#FFFFFF"/>
    <circle cx="43" cy="-17" r="7" fill="#0A0D14"/>
    <path d="M 40,2 L 60,2 L 78,45 L 120,45 L 96,1 C 86,-2 72,-1 62,0 Z" fill="#0A0D14"/>
  </g>

  <!-- "NEETWORK" Sub-mark -->
  <g id="neetwork" transform="translate(50, 320)">
    <!-- N with bottom-left triangle cut -->
    <path d="M 0,36 L 10,36 L 34,8 L 34,36 L 44,36 L 44,0 L 32,0 L 10,26 L 10,0 L 0,0 Z" fill="#0A0D14"/>
    <polygon points="0,36 0,18 18,36" fill="#0A0D14"/>

    <!-- E -->
    <path d="M 58,36 L 98,36 L 98,28 L 70,28 L 70,21 L 94,21 L 94,14 L 70,14 L 70,8 L 98,8 L 98,0 L 58,0 Z" fill="#0A0D14"/>

    <!-- E -->
    <path d="M 112,36 L 152,36 L 152,28 L 124,28 L 124,21 L 148,21 L 148,14 L 124,14 L 124,8 L 152,8 L 152,0 L 112,0 Z" fill="#0A0D14"/>

    <!-- T -->
    <path d="M 166,0 L 206,0 L 206,8 L 190,8 L 190,36 L 182,36 L 182,8 L 166,8 Z" fill="#0A0D14"/>

    <!-- W -->
    <path d="M 218,0 L 229,36 L 238,36 L 249,10 L 260,36 L 269,36 L 280,0 L 268,0 L 262,24 L 251,0 L 247,0 L 236,24 L 230,0 Z" fill="#0A0D14"/>

    <!-- O -->
    <path d="M 304,0 C 290,0 280,8 280,18 C 280,28 290,36 304,36 C 318,36 328,28 328,18 C 328,8 318,0 304,0 Z M 304,28 C 296,28 291,23 291,18 C 291,13 296,8 304,8 C 312,8 317,13 317,18 C 317,23 312,28 304,28 Z" fill="#0A0D14"/>

    <!-- R -->
    <path d="M 342,36 L 352,36 L 352,21 L 366,21 L 379,36 L 392,36 L 377,20 C 386,18 392,13 392,8 C 392,3 386,0 376,0 L 342,0 Z M 352,14 L 352,7 L 374,7 C 378,7 381,8 381,10.5 C 381,13 378,14 374,14 Z" fill="#0A0D14"/>

    <!-- K with filled triangular wings -->
    <path d="M 406,36 L 416,36 L 416,0 L 406,0 Z" fill="#0A0D14"/>
    <polygon points="421,17 444,0 421,0" fill="#0A0D14"/>
    <polygon points="421,19 444,36 421,36" fill="#0A0D14"/>
  </g>
</svg>
